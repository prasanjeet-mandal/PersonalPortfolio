    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="420" y1="40" x2="420" y2="320"/>
  </g>

  <g transform="translate(300, 160)">
    <!-- Cloud and Lambda -->
        <path d="M-25 10 C-35 10 -40 0 -35 -10 C-35 -25 -15 -30 -5 -20 C0 -30 20 -30 25 -15 C35 -15 40 -5 35 10 Z" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
