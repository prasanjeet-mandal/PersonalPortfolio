<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Ambient glow circle -->
  <circle cx="300" cy="180" r="140" fill="url(#glowGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="60" y1="60" x2="540" y2="60"/>
    <line x1="60" y1="120" x2="540" y2="120"/>
    <line x1="60" y1="180" x2="540" y2="180"/>
    <line x1="60" y1="240" x2="540" y2="240"/>
    <line x1="60" y1="300" x2="540" y2="300"/>
    
    <line x1="120" y1="40" x2="120" y2="320"/>
    <line x1="240" y1="40" x2="240" y2="320"/>
    <line x1="360" y1="40" x2="360" y2="320"/>
    <line x1="480" y1="40" x2="480" y2="320"/>
  </g>

  <!-- Center Agro Neural Hub Graphic -->
  <g transform="translate(300, 160)">
    <!-- Orbit Rings -->
    <circle cx="0" cy="0" r="85" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="55" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2"/>
    
    <!-- Central Leaf & AI Core -->
    <circle cx="0" cy="0" r="32" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <path d="M-10 6 C-12 -12 0 -18 10 -16 C12 2 0 16 -10 6 Z M-10 6 L4 -4" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="rgba(16, 185, 129, 0.2)"/>
    
    <!-- Neural Nodes -->
    <g fill="#10B981">
      <circle cx="-60" cy="-35" r="7"/>
      <circle cx="60" cy="-35" r="7"/>
      <circle cx="-70" cy="40" r="6"/>
      <circle cx="70" cy="40" r="6"/>
      <circle cx="0" cy="-85" r="8" fill="#38BDF8"/>
      <circle cx="0" cy="85" r="8" fill="#8B5CF6"/>
    </g>

    <!-- Connectors -->
    <path d="M-60 -35 L-24 -15 M60 -35 L24 -15 M-70 40 L-24 15 M70 40 L24 15 M0 -85 L0 -32 M0 85 L0 32" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Title Pill -->
  <rect x="210" y="290" width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <text x="300" y="313" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">AGROSPHERE</text>
</svg>
