<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="170" r="130" fill="url(#glowGrad)"/>

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1">
    <line x1="60" y1="90" x2="540" y2="90"/>
    <line x1="60" y1="180" x2="540" y2="180"/>
    <line x1="60" y1="270" x2="540" y2="270"/>
    <line x1="180" y1="40" x2="180" y2="320"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="420" y1="40" x2="420" y2="320"/>
  </g>

  <g transform="translate(300, 160)">
    <!-- Terminal & Code tags -->
        <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
        <path d="M-25 -5 L-15 5 L-25 15" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-8" y1="15" x2="10" y2="15" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <rect x="180" y="285" width="240" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#EC4899" stroke-width="1"/>
  <text x="300" y="308" fill="#F1F5F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">WEB SCRAPER ENGINE</text>
</svg>