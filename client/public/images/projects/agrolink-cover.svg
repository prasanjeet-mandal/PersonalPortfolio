<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="170" r="130" fill="url(#glowGrad)"/>

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1">
    <line x1="60" y1="90" x2="540" y2="90"/>
    <line x1="60" y1="180" x2="540" y2="180"/>
    <line x1="60" y1="270" x2="540" y2="270"/>
    <line x1="180" y1="40" x2="180" y2="320"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="420" y1="40" x2="420" y2="320"/>
  </g>

  <g transform="translate(300, 160)">
    <!-- Marketplace Network Icon -->
        <rect x="-35" y="-30" width="70" height="60" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
        <path d="M-20 -10 L0 -22 L20 -10 L0 5 Z" fill="rgba(59, 130, 246, 0.3)" stroke="#38BDF8" stroke-width="1.5"/>
        <path d="M-15 10 L-5 20 L15 20" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-50" cy="10" r="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="50" cy="10" r="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
        <path d="M-36 10 L-35 10 M35 10 L36 10" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
